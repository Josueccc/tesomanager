services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teso}
      POSTGRES_DB: ${POSTGRES_DB:-tesomanager}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teso} -d ${POSTGRES_DB:-tesomanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-teso}:${POSTGRES_PASSWORD:-teso}@db:5432/${POSTGRES_DB:-tesomanager}
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-tesorero@iglesia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiar123}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Tesorero}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  db_data:
