{% extends "base.html" %}
{% block title %}Ingresar · TesoManager{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-10 bg-white rounded-xl shadow p-6">
  <h1 class="text-2xl font-bold mb-1 text-center">💰 TesoManager</h1>
  <p class="text-sm text-slate-500 text-center mb-6">Finanzas de la iglesia</p>
  {% if error %}
  <div class="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Correo</label>
      <input name="email" type="email" required autofocus
             class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-slate-400 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Contraseña</label>
      <input name="password" type="password" required
             class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-slate-400 outline-none">
    </div>
    <button class="w-full bg-slate-900 text-white rounded-lg py-2 font-medium hover:bg-slate-800">Ingresar</button>
  </form>
</div>
{% endblock %}
